name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt

      - name: Version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V=$(python -c "import sys; sys.path.insert(0, 'App'); import sc_version; print(sc_version.VERSION)")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match sc_version.VERSION ($V)"; exit 1
          fi

      - name: Compile check
        run: python -m compileall -q App

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build the app
        run: |
          python packaging/make_version_info.py
          pyinstaller --noconfirm --clean packaging/sc_copilot.spec --distpath dist --workpath build

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $env:SC_COPILOT_HOME = "$env:RUNNER_TEMP\sc_home"
          $p = Start-Process -FilePath "dist\SC Co-Pilot\SC Co-Pilot.exe" -ArgumentList "--selftest" -PassThru -Wait
          Get-Content "$env:SC_COPILOT_HOME\logs\selftest.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed (exit $($p.ExitCode))"; exit 1 }

      - name: Build the installer
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0, 'App'); import sc_version; print(sc_version.VERSION)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$v" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "dist\SC_CoPilot_Setup_$v.exe" "dist\SC_CoPilot_Setup.exe"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SC_CoPilot_Setup
          path: dist/SC_CoPilot_Setup.exe

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: python packaging/release_notes.py

      - name: Checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Get-ChildItem dist\SC_CoPilot_Setup*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release
          path: |
            dist/SC_CoPilot_Setup_*.exe
            dist/SC_CoPilot_Setup.exe
            dist/SHA256SUMS.txt
            release_notes.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/SC_CoPilot_Setup_*.exe
            dist/SC_CoPilot_Setup.exe
            dist/SHA256SUMS.txt
          body_path: release_notes.md
